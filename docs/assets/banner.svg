<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="BloodConnect - Every drop counts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12040a"/><stop offset=".55" stop-color="#34091a"/><stop offset="1" stop-color="#7B1E28"/></linearGradient>
<radialGradient id="glow" cx=".15" cy=".5" r=".45"><stop offset="0" stop-color="#e11d38" stop-opacity=".6"/><stop offset="1" stop-color="#e11d38" stop-opacity="0"/></radialGradient>
<linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4a63"/><stop offset=".6" stop-color="#d4132f"/><stop offset="1" stop-color="#7a0b1d"/></linearGradient>
<path id="d" d="M0-60C0-60-46-2-46 34c0 26 20 46 46 46s46-20 46-46C46-2 0-60 0-60Z"/>
</defs>
<style>
.beat{transform-origin:170px 150px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(.99)}36%{transform:scale(1.04)}}
.ring{transform-origin:170px 150px;fill:none;stroke:#ff4a63;stroke-width:2;opacity:0;animation:ring 1.6s ease-out infinite}
.ring.b{animation-delay:.25s}
@keyframes ring{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.9);opacity:0}}
.ecg{fill:none;stroke:#ff4a63;stroke-width:3;stroke-linejoin:round;stroke-dasharray:420 1400;animation:ecg 3.2s linear infinite;filter:drop-shadow(0 0 5px #ff4a63)}
@keyframes ecg{from{stroke-dashoffset:1820}to{stroke-dashoffset:0}}
.fall{animation:fall 3.4s cubic-bezier(.55,0,.9,.5) infinite}
.fall.b{animation-delay:1.7s}
@keyframes fall{0%{transform:translateY(-70px);opacity:1}70%{transform:translateY(300px);opacity:1}71%,100%{transform:translateY(300px);opacity:0}}
.rip{fill:none;stroke:#ff4a63;stroke-width:2;transform-origin:1060px 306px;animation:rip 3.4s infinite;opacity:0}
.rip.b{transform-origin:1120px 306px;animation-delay:1.7s}
@keyframes rip{0%,70%{transform:scale(0);opacity:0}71%{opacity:.9}100%{transform:scale(1);opacity:0}}
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#glow)"/>
<circle class="ring" cx="170" cy="150" r="80"/><circle class="ring b" cx="170" cy="150" r="80"/>
<g class="beat"><use href="#d" transform="translate(170 150) scale(1.5)" fill="url(#liq)"/>
<ellipse cx="143" cy="130" rx="11" ry="24" fill="#fff" opacity=".4" transform="rotate(18 143 130)"/></g>
<text x="330" y="150" font-size="80" font-weight="800" fill="#fff" letter-spacing="-2">Blood<tspan fill="#F3B95F">Connect</tspan></text>
<text x="334" y="198" font-size="27" fill="#f4d9d4">Every drop counts. A real-time blood donation network.</text>
<text x="334" y="238" font-size="17" fill="#c8a7a9" letter-spacing="3">ASP.NET CORE 10  ·  EF CORE  ·  SIGNALR  ·  SQL SERVER</text>
<g fill="url(#liq)"><g class="fall" transform="translate(1060 0)"><use href="#d" transform="translate(0 40) scale(.3)"/></g>
<g class="fall b" transform="translate(1120 0)"><use href="#d" transform="translate(0 40) scale(.22)"/></g></g>
<ellipse class="rip" cx="1060" cy="306" rx="34" ry="7"/><ellipse class="rip b" cx="1120" cy="306" rx="26" ry="5"/>
<path d="M0 290H300l14-28 18 62 16-44 10 10H620l14-28 18 62 16-44 10 10H940l14-28 18 62 16-44 10 10H1200" fill="none" stroke="#ff4a63" stroke-opacity=".2" stroke-width="2"/>
<path class="ecg" d="M0 290H300l14-28 18 62 16-44 10 10H620l14-28 18 62 16-44 10 10H940l14-28 18 62 16-44 10 10H1200"/>
</svg>
